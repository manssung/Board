name: Background inquiry analysis
on:
  schedule:
    # 06:00 KST with fallback runs at 06:20 and 06:40; quota probe is once per Korean day.
    - cron: '0,20,40 21 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: background-inquiry-analysis
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Analyze up to 30 inquiries
        working-directory: frontend
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/run-background-analysis.js
